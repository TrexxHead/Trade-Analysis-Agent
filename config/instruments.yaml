# Kora's watchlist. `code` is the short label shown everywhere in the hub,
# `symbol` is the exact MT5 Market Watch name on your Deriv MT5 account -
# CONFIRM each one matches your terminal (brokers sometimes add suffixes).
# A mismatched symbol shows up as an error on the Scanner/Kora pages rather
# than crashing the rest of the watchlist.
#
# `currencies` drives fundamentals: which economic-calendar releases matter
# for the instrument. Synthetic indices are algorithmically generated, so
# they have none - Kora analyses them purely technically/statistically.
# This file is the CATALOG of instruments Kora knows about. Which of them you
# actually watch is your watchlist, edited in the hub (Settings -> Watchlist,
# or the star on any Scanner row). You can also add custom MT5 symbols there.
instruments:
  - {code: STEP,     symbol: "Step Index", deriv_symbol: stpRNG,            name: "Step Index",     kind: Synthetics, digits: 1, currencies: []}
  - {code: V10,      symbol: "Volatility 10 Index", deriv_symbol: R_10,   name: "Volatility 10",  kind: Synthetics, digits: 3, currencies: []}
  - {code: V25,      symbol: "Volatility 25 Index", deriv_symbol: R_25,   name: "Volatility 25",  kind: Synthetics, digits: 3, currencies: []}
  - {code: V75,      symbol: "Volatility 75 Index", deriv_symbol: R_75,   name: "Volatility 75",  kind: Synthetics, digits: 2, currencies: []}
  - {code: V100,     symbol: "Volatility 100 Index", deriv_symbol: R_100,  name: "Volatility 100", kind: Synthetics, digits: 2, currencies: []}
  - {code: BOOM500,  symbol: "Boom 500 Index", deriv_symbol: BOOM500,        name: "Boom 500",       kind: Synthetics, digits: 3, currencies: [], spikes: up}
  - {code: CRASH500, symbol: "Crash 500 Index", deriv_symbol: CRASH500,       name: "Crash 500",      kind: Synthetics, digits: 3, currencies: [], spikes: down}
  - {code: BOOM1000, symbol: "Boom 1000 Index",       deriv_symbol: BOOM1000, name: "Boom 1000",      kind: Synthetics, digits: 3, currencies: [], spikes: up}
  - {code: CRASH1000,symbol: "Crash 1000 Index",      deriv_symbol: CRASH1000, name: "Crash 1000",    kind: Synthetics, digits: 3, currencies: [], spikes: down}
  - {code: XAUUSD,   symbol: "XAUUSD", deriv_symbol: frxXAUUSD,                name: "Gold",           kind: Metals,     digits: 2, currencies: [USD], usd_proxy: EURUSD, peer: XAGUSD}
  - {code: XAGUSD,   symbol: "XAGUSD", deriv_symbol: frxXAGUSD,                name: "Silver",         kind: Metals,     digits: 3, currencies: [USD], usd_proxy: EURUSD, peer: XAUUSD}
  - {code: EURUSD,   symbol: "EURUSD", deriv_symbol: frxEURUSD,                name: "Euro / USD",     kind: Forex,      digits: 5, currencies: [EUR, USD], peer: GBPUSD}
  - {code: GBPUSD,   symbol: "GBPUSD", deriv_symbol: frxGBPUSD,                name: "Pound / USD",    kind: Forex,      digits: 5, currencies: [GBP, USD], peer: EURUSD}

# Timeframes Kora reads each cycle, and how many candles of each.
timeframes:
  D1: 220
  H4: 300
  H1: 400
  M15: 500

# The timeframe entry plans are built on (H4/D1 provide the higher-timeframe filter).
execution_timeframe: H1

# Default watchlist (used until you edit it in the hub).
default_watchlist: [XAUUSD, XAGUSD, V75, BOOM1000, CRASH1000]
